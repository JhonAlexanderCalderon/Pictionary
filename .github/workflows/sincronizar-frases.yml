name: Sincronizar frases desde Notion

on:
  workflow_dispatch:        # boton "Run workflow" para actualizar al momento
  schedule:
    - cron: '0 11 * * *'    # ademas, una vez al dia (11:00 UTC)

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar frases
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: node scripts/notion-a-frases.mjs

      - name: Publicar cambios
        run: |
          if [ -n "$(git status --porcelain frases.json frases.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frases.json frases.txt
            git commit -m "Frases actualizadas desde Notion"
            git push
          else
            echo "Nada que publicar."
          fi
